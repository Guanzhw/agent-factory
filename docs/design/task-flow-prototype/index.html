e p{margin-bottom:20px}.returnline{display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-bottom:20px}.returnline a{min-height:44px;display:inline-flex;align-items:center}.rule{font-size:13px;color:var(--muted);max-width:68ch;margin:12px 0 0}.scopebox{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 0;margin:22px 0}.scopebox p{margin:0 0 6px}.inline-link{padding:8px 0;display:inline-block;min-height:44px}.task-row-main{display:grid;gap:4px}.task-row-main a{font-weight:650}.technical{font-size:13px;color:var(--muted)}.technical dl{display:grid;grid-template-columns:125px 1fr;gap:10px}.technical dt{font-weight:500}.technical dd{margin:0;overflow-wrap:anywhere}.sample-controls{margin-top:44px;color:var(--muted);font-size:13px;max-width:900px}.sample-controls summary{font-size:13px}.sample-controls button{font-size:13px}dialog{max-width:480px;width:calc(100vw - 32px);border:1px solid var(--line);border-radius:12px;padding:26px;color:var(--ink);box-shadow:0 18px 60px #16294730}dialog::backdrop{background:#17263e66}dialog h2{font-size:22px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}[hidden]{display:none!important}.listrow>*{min-width:0}button,a,td,p,h1,h2,h3{overflow-wrap:anywhere}@media(max-width:1000px){main{padding:30px 28px 60px}.tasklayout{grid-template-columns:1fr}.taskaside{border:0;border-top:1px solid var(--line);padding:20px 0 0}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.sidebar{width:210px;padding:24px 14px}main{margin-left:210px}.brand{font-size:16px}}@media(max-width:700px){.samplebar{font-size:11px;padding:7px 12px;gap:8px;line-height:1.45}.samplebar button{padding:7px 9px;min-height:44px;font-size:12px}.sidebar{position:static;width:auto;padding:15px 16px 12px;border-right:0;border-bottom:1px solid var(--line)}.brand{margin:0 0 14px;font-size:17px}.brandmark{width:30px;height:32px}.primary-nav{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.navlink{justify-content:center;gap:6px;padding:10px 6px;font-size:14px;min-height:46px}.navlink svg{width:18px;height:18px}.mobile-more{display:flex;margin-left:auto;min-height:44px;padding:8px 12px}.secondary-nav{display:none;margin-top:12px;padding-top:12px;grid-template-columns:1fr 1fr}.secondary-nav.open{display:grid}.sidebar-note{display:none}main{margin-left:0;padding:26px 16px 60px}.pagehead{display:block;margin-bottom:24px}.pagehead .back{margin-top:12px}.pagehead p{font-size:15px}h1{font-size:26px}h2{font-size:20px}.hero{display:block;padding:24px}.hero .appicon{margin-bottom:18px}.hero h2{font-size:24px}.listrow{align-items:flex-start;flex-direction:column;padding:18px;gap:13px}.listrow>.actions{margin:0}.row{align-items:flex-start;gap:14px;flex-wrap:wrap}.formgrid{grid-template-columns:1fr}.facts{gap:15px;grid-template-columns:1fr 1fr}.facts dd{font-size:14px}.panel,.attention{padding:20px}.actions{gap:10px}.actions>button.primary,.actions>a.primary{min-width:150px}.workflow{gap:9px}.workflow li{font-size:12px}.workflow .dot{width:20px;height:20px}.technical dl{grid-template-columns:1fr;gap:4px}.technical dd{margin-bottom:9px}.sample-controls{margin-top:32px}.context{font-size:14px;margin-bottom:20px}.tasklayout{gap:22px}.tabs{gap:4px}.tabs a{font-size:14px;padding:9px 10px}.form input,.form select,.form textarea{font-size:16px}.rule{line-height:1.65}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

<body>
<a class="skip" href="#main">跳到主要内容</a>
<div class="samplebar"><span><strong>交互设计原型</strong> · 全部为示例数据<br class="mobile-break">不会保存凭据或执行任务</span><button type="button" data-action="reset">重置样例</button></div>
<aside class="sidebar"><div class="brand"><span class="brandmark" aria-hidden="true">A</span>Agent Factory<button class="mobile-more" aria-expanded="false" aria-controls="secondary" data-action="more">更多</button></div><nav class="primary-nav" aria-label="主导航" id="primary"></nav><nav class="secondary-nav" aria-label="次级导航" id="secondary"></nav><div class="sidebar-note">离线流程评审<br>不包含登录或真实执行</div></aside>
<main id="main"></main>
<div id="live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<dialog id="leave-dialog" aria-labelledby="leave-title"><h2 id="leave-title">保留这次编辑吗？</h2><p>当前有尚未保存的示例输入。继续编辑，或放弃修改后离开。</p><div class="actions"><button class="primary" data-action="stay" autofocus>继续编辑</button><button data-action="discard">放弃并离开</button></div></dialog>
<dialog id="reset-dialog" aria-labelledby="reset-title"><h2 id="reset-title">重置本页原型样例？</h2><p>仅清除这个浏览器标签页里的非秘密示例状态，回到最初的项目和任务。不会操作产品数据。</p><div class="actions"><button data-action="reset-cancel" autofocus>取消</button><button class="danger" data-action="reset-confirm">重置样例</button></div></dialog>
<script>
'use strict';
const KEY='agent-factory-task-prototype-v1';
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed=()=>({schema:1,seq:1,project:{name:'低成本文本分类',goal:'在既有数据集上比较两种轻量分类方法，记录成本与准确率。',model:null,stage:'resources',taskId:null},models:[{id:'team-model',name:'团队文本模型',service:'compatible',model:'team-text-v1',endpoint:'https://model.example.invalid/v1',protocol:'Chat Completions',auth:'示例凭据 · 团队连接',scope:'团队共享',verified:false}],templates:[{id:'brief',name:'资料摘要',description:'从提供的资料中提取要点与待确认问题。',version:1,author:'self',contract:'v1',published:true},{id:'compare',name:'方案比较',description:'按指定维度整理不同方案的证据与差异。',version:2,author:'other',contract:'v1',published:true}],drafts:[],proposals:[],schedules:[],forms:{},tasks:[{id:'answer-example',name:'整理研究资料',status:'waiting',origin:'research',question:'这次需要优先比较成本，还是准确率？',answer:''},{id:'failed-example',name:'低成本文本分类 · 先前尝试',status:'failed',origin:'research',resourceFixed:false},{id:'running-example',name:'资料摘要 · 运行中样例',status:'running',origin:'template',templateId:'brief'},{id:'result-example',name:'资料摘要 · 结果说明样例',status:'completed',origin:'template',templateId:'brief'}],emptyTemplates:false,templateLoadError:false,notice:''});
let storageOK=true,S;
try{const raw=sessionStorage.getItem(KEY);S=raw?JSON.parse(raw):seed();if(S.schema!==1)S=seed();}catch(e){storageOK=false;S=seed();}
function persist(){try{sessionStorage.setItem(KEY,JSON.stringify(S));}catch(e){storageOK=false;}}
let route=location.hash.slice(1)||'/apps',routeIndex=Number(history.state?.afIndex||0),formErrors={},leaveTarget=null,restoring=false,moreOpen=false,activeFormKey=null;
if(!route.startsWith('/'))route='/apps';
history.replaceState({afIndex:routeIndex},'', '#'+route);
const icon=k=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+({apps:'<path d="M3 10 12 3l9 7M5 9v12h14V9M9 21v-8h6v8"/>',tasks:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="m8 11 2 2 5-5M8 17h8"/>',resources:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/>',templates:'<path d="M5 3h10l4 4v14H5zM14 3v5h5M8 12h8M8 16h8"/>',settings:'<path d="M5 6h14M5 12h14M5 18h14"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="10" cy="18" r="2"/>'}[k]||'')+'</svg>';
function link(url,text,cls=''){return '<a href="#'+esc(url)+'" data-nav="'+esc(url)+'"'+(cls?' class="'+esc(cls)+'"':'')+'>'+text+'</a>';}
function btn(action,text,cls='',attrs=''){return '<button type="button" data-action="'+esc(action)+'" class="'+cls+'" '+attrs+'>'+text+'</button>';}
function badge(text,type=''){return '<span class="badge '+type+'">'+esc(text)+'</span>';}
function head(title,subtitle,back){return '<header class="pagehead"><div><h1 tabindex="-1">'+esc(title)+'</h1><p>'+esc(subtitle)+'</p></div>'+(back?link(back.url,esc(back.text),'button back'):'')+'</header>';}
function note(text,kind=''){return '<div class="notice '+kind+'">'+text+'</div>';}
function query(){return new URLSearchParams(route.split('?')[1]||'');}
function path(){return route.split('?')[0];}
function model(id){return S.models.find(m=>m.id===id);}
function task(id){return S.tasks.find(t=>t.id===id);}
function template(id){return S.templates.find(t=>t.id===id);}
function proposal(id){return S.proposals.find(p=>p.id===id);}
function schedule(id){return S.schedules.find(s=>s.id===id);}
function newId(prefix){return prefix+'-'+S.seq++;}
// A completed gesture must not authorize the next action after the DOM changes.
const protectedActions=new Set(['choose-model','project-save','project-publish','project-apply','project-confirm','project-start','proposal-check','proposal-accept','proposal-start','draft-publish','task-stop','stop-check','stop-continue','schedule-toggle']);
let actionBlockedUntil=0,actionReleaseTimer=0;
function actionButton(el){return !!el&&(el.type==='submit'||protectedActions.has(el.dataset.action));}
function updateActionButtons(){
 const blocked=performance.now()<actionBlockedUntil;
 document.querySelectorAll('main button').forEach(b=>{if(!actionButton(b))return;if(blocked&&!b.disabled){b.disabled=true;b.dataset.actionWait='true';b.title='请稍候，再单独确认下一步';}else if(!blocked&&b.dataset.actionWait){b.disabled=false;delete b.dataset.actionWait;b.removeAttribute('title');}});
 clearTimeout(actionReleaseTimer);if(blocked)actionReleaseTimer=setTimeout(updateActionButtons,Math.max(1,actionBlockedUntil-performance.now()+5));
}
function beginAction(){if(performance.now()<actionBlockedUntil)return false;actionBlockedUntil=performance.now()+650;updateActionButtons();return true;}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(actionButton(b)&&(e.detail>1||performance.now()<actionBlockedUntil)){e.preventDefault();e.stopImmediatePropagation();}},true);
document.addEventListener('keydown',e=>{if(e.repeat&&['Enter',' '].includes(e.key)&&actionButton(e.target.closest('button'))){e.preventDefault();e.stopImmediatePropagation();}},true);

function originText(origin){return origin==='research'?'AutoResearch / 低成本文本分类':origin?.startsWith('task:')?'原任务 / '+(task(origin.slice(5))?.name||'任务'):origin?.startsWith('run:')?'任务模板 / '+(template(origin.slice(4))?.name||'模板'):'我的资源';}
function modelSaveLabel(origin){return origin==='research'?'保存并返回项目':origin?.startsWith('task:')?'保存并返回任务':origin?.startsWith('run:')?'保存并返回当前创建':'保存并返回模型列表';}
function finishModel(origin,message){if(origin?.startsWith('task:'))message='已选择后续使用的模型，未验证连通性；原失败记录不变。';if(origin==='research'&&S.project.taskId)message='已保留后续模型候选，未验证连通性；原运行绑定不变。';setNotice(message);const next=origin==='resources'?'/model?origin=resources':originUrl(origin);if(next===route)render();else navigate(next,true);}
function originUrl(origin){return origin==='research'?'/research':origin?.startsWith('task:')?'/task/'+origin.slice(5):origin?.startsWith('run:')?(S.contextRoutes?.[origin]||'/run/'+origin.slice(4)):'/resources';}
function context(origin){return '<div class="context">正在为 <strong>'+esc(originText(origin))+'</strong> 准备模型。完成后回到原位置，已有目标与输入会保留。</div>';}
function setNotice(text){S.notice=text;persist();$('#live').textContent=text;}
function formData(key,defaults){activeFormKey=key;if(!S.forms[key])S.forms[key]={values:defaults,dirty:false};return S.forms[key].values;}
function formStart(id){return '<form class="form" id="'+id+'" data-form="'+id+'" novalidate>';}
function input(name,label,value,help='',type='text',required=false){return '<div class="field"><label for="'+name+'">'+esc(label)+(required?' <span class="muted">（必填）</span>':'')+'</label><input id="'+name+'" name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+(required?'required ':'')+'autocomplete="off"'+(type==='number'?' min="1" max="20"':'')+' aria-describedby="'+name+'-help'+(formErrors[name]?' '+name+'-error':'')+'"'+(formErrors[name]?' aria-invalid="true"':'')+'><p id="'+name+'-help">'+esc(help)+'</p>'+(formErrors[name]?'<p class="field-error" id="'+name+'-error" role="alert">'+esc(formErrors[name])+'</p>':'')+'</div>';}
function textarea(name,label,value,help='',required=false){return '<div class="field"><label for="'+name+'">'+esc(label)+(required?' <span class="muted">（必填）</span>':'')+'</label><textarea id="'+name+'" name="'+name+'" '+(required?'required ':'')+'maxlength="2000" aria-describedby="'+name+'-help'+(formErrors[name]?' '+name+'-error':'')+'"'+(formErrors[name]?' aria-invalid="true"':'')+'>'+esc(value)+'</textarea><p id="'+name+'-help">'+esc(help)+'</p>'+(formErrors[name]?'<p class="field-error" id="'+name+'-error" role="alert">'+esc(formErrors[name])+'</p>':'')+'</div>';}
function select(name,label,value,options,help=''){return '<div class="field"><label for="'+name+'">'+esc(label)+'</label><select id="'+name+'" name="'+name+'" aria-describedby="'+name+'-help">'+options.map(o=>'<option value="'+esc(o[0])+'"'+(o[0]===value?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select><p id="'+name+'-help">'+esc(help)+'</p></div>';}
function endForm(label){return '<div class="actions"><button type="submit" class="primary">'+esc(label)+'</button></div></form>';}
function markSaved(){if(activeFormKey)delete S.forms[activeFormKey];activeFormKey=null;formErrors={};persist();}
function isDirty(){return !!(activeFormKey&&S.forms[activeFormKey]?.dirty);}
function navigate(next,force=false){if(next===route)return;if(isDirty()&&!force){leaveTarget={url:next};$('#leave-dialog').showModal();return;}routeIndex++;history.pushState({afIndex:routeIndex},'','#'+next);route=next;formErrors={};render();}
window.addEventListener('popstate',e=>{if(restoring){restoring=false;return;}const next=location.hash.slice(1)||'/apps',idx=Number(e.state?.afIndex||0);if(isDirty()){const delta=routeIndex-idx;leaveTarget={url:next,popDelta:-delta};restoring=true;history.go(delta||1);$('#leave-dialog').showModal();return;}route=next;routeIndex=idx;formErrors={};render();});
window.addEventListener('hashchange',()=>{if(restoring||location.hash.slice(1)===route)return;const next=location.hash.slice(1)||'/apps';if(isDirty()){history.replaceState({afIndex:routeIndex},'','#'+route);leaveTarget={url:next};$('#leave-dialog').showModal();return;}route=next;routeIndex++;history.replaceState({afIndex:routeIndex},'','#'+route);render();});
window.addEventListener('beforeunload',e=>{if(isDirty()){e.preventDefault();e.returnValue='';}});
function renderNav(){const p=path(),area=p==='/apps'||p==='/research'?'apps':p.startsWith('/task')||p.startsWith('/proposal')||p.startsWith('/schedule')?'tasks':p.startsWith('/model')||p==='/resources'?'resources':p.startsWith('/setting')?'settings':'templates';$('#primary').innerHTML=[['apps','应用'],['tasks','我的任务'],['resources','我的资源']].map(([k,t])=>'<a class="navlink" href="#/'+k+'" data-nav="/'+k+'"'+(area===k?' aria-current="page"':'')+'>'+icon(k)+t+'</a>').join('');$('#secondary').innerHTML=[['templates','模板与材料'],['settings','设置']].map(([k,t])=>'<a class="navlink" href="#/'+k+'" data-nav="/'+k+'"'+(area===k?' aria-current="page"':'')+'>'+icon(k)+t+'</a>').join('');$('#secondary').classList.toggle('open',moreOpen);$('.mobile-more').setAttribute('aria-expanded',String(moreOpen));}
function apps(){return head('应用','进入工作台，开始这次工作。')+'<section class="hero"><div class="appicon">'+icon('templates')+'</div><div><div class="eyebrow">已安装工作台</div><h2>AutoResearch</h2><p>围绕项目制定研究约定、准备执行配置，再查看任务与证据。</p>'+link('/research','进入 AutoResearch','button primary')+'<p class="rule">本原型只演示示例项目与底座之间的交接。</p></div></section><section class="section"><div class="row"><h2>处理中的工作</h2>'+link('/tasks','查看我的任务 →','inline-link')+'</div><div class="list"><div class="listrow"><div><h3>低成本文本分类</h3><p>'+ (S.project.taskId?'已有示例任务，仍可返回项目查看。':'研究约定已保存，尚未确认。继续准备当前项目。')+'</p></div>'+link('/research','继续项目','button')+'</div></div></section><section class="section"><h2>使用团队的任务模板</h2><p class="muted">模板是可重复运行的任务定义，与上面的工作台不同。</p>'+link('/templates','浏览已发布任务模板 →','inline-link')+'</section>';}
function project(){const p=S.project,from=task(query().get('from')),original=from||task(p.taskId),locked=!!original,candidate=model(from?.repairModelId||p.candidateModel),m=from?null:model(p.model),stages=['resources','draft','published','applied','confirmed','started'],i=stages.indexOf(p.stage),userStage=i===0?0:i<3?1:2;let primary='',msg='';if(locked){primary=link('/task/'+original.id,'查看原任务','button primary');msg='后续研究需核对原轮次和约定，本轮不演示续接。原任务记录与运行绑定保持不变。';}else if(!m){primary='';msg='先选一个模型。运行环境与已发布实验工具已分别备妥。';}else if(i<1){primary=btn('project-save','保存研究配置草稿','primary');msg='资源已选齐；模型连通性尚未验证。先保存当前配置草稿。';}else if(i===1){primary=btn('project-publish','发布配置定义','primary');msg='配置草稿已保存。发布后定义可供团队读取，个人连接与凭据不会公开。';}else if(i===2){primary=btn('project-apply','用于当前约定并保存','primary');msg='配置定义已发布，还没有用于当前研究约定。';}else if(i===3){primary=btn('project-confirm','确认研究约定','primary');msg='约定已保存所选配置；请核对下方研究目标与预算后确认。';}else if(i===4){primary=btn('project-start','启动研究任务','primary');msg='约定已确认。启动会创建一个本地演示任务，不调用模型或计算资源。';}else{primary=link('/task/'+p.taskId,'查看原任务','button primary');msg='示例任务已创建。运行状态不会自动变成完成。';}
const agreement='<details '+(i===3?'open':'')+'><summary>已保存的研究约定 · '+(i>=4?'已确认':'尚未确认')+'</summary><div><p>'+esc(p.goal)+'</p><dl class="facts"><div><dt>研究范围</dt><dd>示例数据集 · 两种方法</dd></div><div><dt>执行预算</dt><dd>最多 2 轮 · 每轮 60 秒</dd></div><div><dt>结果要求</dt><dd>记录方法、成本与准确率</dd></div></dl></div></details>';
return head(p.name,'AutoResearch · 仅演示项目与底座的交接',{url:'/apps',text:'返回应用'})+'<ol class="workflow">'+['准备资源','核对配置','确认并启动'].map((t,n)=>'<li class="'+(n<userStage?'done':n===userStage?'now':'')+'"><span class="dot">'+(n<userStage?'✓':n+1)+'</span>'+t+'</li>').join('')+'</ol><section><h2>'+(locked?'原任务与后续边界':!m?'这次还缺一个模型':i===3?'核对研究约定':'下一步')+'</h2><p>'+esc(msg)+'</p>'+(candidate?'<p class="context">后续模型候选：<strong>'+esc(candidate.name)+'</strong>。尚未采用、未验证连通性。</p>':'')+(i===3&&!locked?agreement:'')+(primary?'<div class="actions">'+primary+'</div>':'')+'</section><section class="section"><h2>本次使用的资源</h2><div class="list"><div class="listrow"><div><h3>模型 '+badge(locked?'原绑定只读':m?'已选择':'缺少',locked||m?'blue':'warn')+'</h3><p>'+esc(m?m.name+' · 未验证连通性':locked?'失败记录中的原连接；本轮不更改。':'复用已有连接，或补充一个配置。')+'</p></div>'+(locked?'<span class="small muted">不能修改原运行</span>':link('/model?origin=research',m?'更换模型':'选择模型','button'+(m?'':' primary')))+'</div><div class="listrow"><div><h3>运行环境 '+badge('已准备 · 示例','good')+'</h3><p>研究环境 A · 最多 60 秒/轮</p></div><span class="small muted">本轮不连接主机</span></div><div class="listrow"><div><h3>实验工具 '+badge('已发布 @1 · 示例','good')+'</h3><p>文本分类实验 · 适配当前环境</p></div><span class="small muted">本轮不执行工具</span></div></div></section>'+(i!==3||locked?agreement:'')+'<details><summary>发布、配置与执行的范围</summary><div><p>配置定义发布后团队可读；个人连接与凭据不公开。发布后还需用于本约定并保存，再确认约定、明确启动。</p><p>资源状态是独立样例；保存模型不证明它可用，也不会自动执行研究。</p></div></details>';}
function resources(){return head('我的资源','按这次工作所需准备连接，已有配置可以复用。')+'<div class="list"><div class="listrow"><div><h3>模型</h3><p>'+S.models.length+' 个示例连接 · 配置保存与连通性验证分别显示</p></div>'+link('/model?origin=resources','查看模型','button primary')+'</div><div class="listrow"><div><h3>我的 Linux 主机</h3><p>研究环境 A · 示例准备状态，不连接 SSH</p></div>'+link('/settings/servers','查看演示范围','button')+'</div></div><section class="section"><h2>其他连接与凭据</h2><p class="muted">工具、已有远程服务与凭据轮换按用途进入。这个任务原型不演示这些维护操作。</p>'+link('/settings/connections','查看支持边界 →','inline-link')+'</section>';}
function models(){const origin=query().get('origin')||'resources';if(origin==='research'&&S.project.taskId)return head('原研究配置保持只读','原任务已创建。后续研究须核对原轮次和约定，本轮不演示续接。',{url:'/research',text:'返回原项目'})+note('不能通过更换模型重置原运行或重新启动。','warning');const selected=origin==='research'?S.project.model:null;return head('选择这次使用的模型','先复用已有连接。只有缺少合适配置时才新增。',{url:originUrl(origin),text:'返回'+(origin==='research'?'项目':'原位置')})+context(origin)+'<div class="list">'+S.models.map(m=>'<div class="listrow"><div><h3>'+esc(m.name)+' '+badge(m.scope)+'</h3><p>'+esc(m.model)+' · '+esc(m.protocol)+'</p><p>配置已保存 · 未验证连通性</p></div>'+btn('choose-model','使用这个连接',selected===m.id?'':'primary','data-id="'+esc(m.id)+'" data-origin="'+esc(origin)+'"')+'</div>').join('')+'</div><div class="actions">'+link('/model-new?origin='+encodeURIComponent(origin),'添加示例配置','button')+'</div><p class="rule">只改变当前上下文的选择。不会自动设为全团队默认，也不会启动任务。</p>';}
function modelNew(){const origin=query().get('origin')||'resources',v=formData(route,{service:'compatible',modelId:'',endpoint:'',protocol:'Chat Completions',auth:'sample'});return head('添加模型配置','填写当前缺项，不需要另外进入凭据管理。',{url:'/model?origin='+encodeURIComponent(origin),text:'返回选择模型'})+context(origin)+note('仅使用固定的示例凭据；请勿输入真实密钥、账号或服务地址。','warning')+formStart('model-form')+select('service','模型服务',v.service,[['compatible','兼容 OpenAI 的服务'],['openai','OpenAI']], '不同服务的模型 ID 由提供方决定。')+input('modelId','模型 ID',v.modelId,'示例：team-text-v1；这里不会查询提供方。','text',true)+(v.service==='compatible'?input('endpoint','API 地址',v.endpoint,'使用 .invalid 示例域名，例如 https://model.example.invalid/v1。','text',true):'')+select('auth','访问认证',v.auth,[['sample','使用固定示例凭据'],['none','无需认证']],v.auth==='none'?'示例服务不需要认证；不发送任何秘密。':'原型没有密钥输入框，也不会保存或发送凭据。')+'<details><summary>API 协议</summary><div>'+select('protocol','接口协议',v.protocol,[['Chat Completions','Chat Completions'],['Responses','Responses']],'默认使用 Chat Completions；若服务使用 Responses，可在这里选择。')+'</div></details><div class="scopebox"><strong>保存范围</strong><p>个人示例连接；用于 '+esc(originText(origin))+'。</p><span class="small muted">仅保存配置描述，不验证连通性，不发布为团队默认。</span></div>'+endForm(modelSaveLabel(origin));}

function templates(){return head('任务模板','使用已发布的任务定义。发布模板不会安装新的业务工作台。')+'<nav class="tabs" aria-label="共享内容">'+link('/templates','任务模板','active')+link('/materials','材料')+'</nav>'+(S.templateLoadError?'<div class="empty"><h2>暂时无法读取模板</h2><p>这是原型里的读取失败样例，当前选择没有改变。</p>'+btn('templates-retry','重新读取','primary')+'</div>':S.emptyTemplates?'<div class="empty"><h2>还没有已发布的任务模板</h2><p>可以先进入已安装的 AutoResearch。模板作者需要准备定义、材料和已登记组件；这里不会自动生成第一份模板。</p>'+link('/apps','返回应用','button primary')+'<div>'+link('/settings/template-advanced','作者需要准备什么？','inline-link')+'</div></div>':'<div class="list">'+S.templates.filter(t=>t.published).map(t=>'<div class="listrow"><div><h3>'+esc(t.name)+' '+badge('已发布 @'+t.version,'blue')+'</h3><p>'+esc(t.description)+'</p></div>'+link('/template/'+t.id,'查看模板','button')+'</div>').join('')+'</div><details><summary>按目标关键词匹配模板</summary><div>'+formStart('match-form')+textarea('goal','你想完成什么？',S.forms[route]?.values?.goal||'','按标题与关键词做规则匹配，不是 AI 推断。',true)+endForm('查找匹配模板')+'</div></details>')+(S.drafts.some(d=>!d.published)?'<section class="section"><h2>我的未发布版本</h2><div class="list">'+S.drafts.filter(d=>!d.published).map(d=>'<div class="listrow"><div><h3>'+esc(d.name)+' '+badge('草稿 @'+d.version)+'</h3><p>'+esc(d.description)+'</p></div>'+link('/draft/'+d.id,'继续这个草稿','button')+'</div>').join('')+'</div></section>':'')+'<details class="sample-controls"><summary>原型场景</summary><div class="actions">'+btn('templates-empty',S.emptyTemplates?'恢复示例模板':'查看无模板空态')+btn('templates-error','查看读取失败')+'</div></details>';}
function templateDetail(id){const t=template(id);if(!t)return missing();return head(t.name,t.description,{url:'/templates',text:'返回任务模板'})+'<div class="row">'+badge('已发布 @'+t.version,'blue')+'<span class="small muted">'+(t.author==='self'?'我的模板 · 可编辑新版本':'团队作者的模板 · 可复制')+'</span></div><dl class="facts"><div><dt>必填业务输入</dt><dd>任务目标、资料文本</dd></div><div><dt>所需连接</dt><dd>一个文本模型</dd></div><div><dt>执行方式</dt><dd>当前平台或已连接的远端平台</dd></div></dl><div class="actions">'+link('/run/'+id,'用此模板创建任务','button primary')+link('/author/'+id,t.author==='self'?'编辑下一版本':'复制为我的草稿','button')+'</div><details><summary>版本、依赖与能力</summary><div class="technical"><dl><dt>固定模板</dt><dd>'+esc(t.id)+' @'+t.version+' · v1 引导编辑支持子集</dd><dt>依赖材料</dt><dd>资料整理提示词 @1（已发布示例）</dd><dt>输入规则</dt><dd>goal：文本；sourceText：文本，两项必填</dd><dt>声明能力</dt><dd>读取提供的文本，调用所选文本模型</dd><dt>默认预算</dt><dd>最多 '+(t.toolCalls||3)+' 次工具调用，输出上限 64 KiB</dd></dl></div></details><section class="section"><h2>制作其他类型的模板</h2><p class="muted">v2 / native 定义需要高级定义与已登记组件。本原型不提供通用可视化编辑或草稿试运行。</p>'+link('/settings/template-advanced','查看作者前置条件 →','inline-link')+'</section>';}
function runTemplate(id){const t=template(id);if(!t)return missing();const carried=query().get('goal')||'',v=formData(route,{goal:carried,sourceText:'',modelId:S.models[0]?.id||'',location:'local',toolCalls:String(t.toolCalls||3),unknown:false});return head('用“'+t.name+'”创建任务','先补业务输入，生成提案后再核对。',{url:'/template/'+id,text:'返回模板'})+'<div class="context">已带入 <strong>'+esc(t.name)+' @'+t.version+'</strong> 与所需材料版本。这里只填写本次不同的内容。</div>'+formStart('run-form')+textarea('goal','任务目标',v.goal,'仅填写示例目标，不使用真实公司资料。',true)+textarea('sourceText','要处理的资料',v.sourceText,'在原型中填写任意非敏感示例文本。',true)+select('modelId','使用的模型',v.modelId,S.models.map(m=>[m.id,m.name+' · '+m.scope]),'复用已有连接；配置保存不代表连通性已经验证。')+link('/model?origin=run:'+id,'缺少合适模型？去选择或添加 →','inline-link')+'<details><summary>预算与执行位置</summary><div>'+input('toolCalls','最多工具调用次数',v.toolCalls,'执行前会再次显示实际范围。','number',true)+select('location','执行位置',v.location,[['local','当前平台（本地）'],['remote','已连接的远端平台 · 示例']],'远端平台方案不支持从这里创建定时计划。')+'</div></details><details class="sample-controls"><summary>原型提交场景</summary><div><label class="check"><input type="checkbox" name="unknown" '+(v.unknown?'checked':'')+'>这次预览显示“原请求待核对”<small>仅用于评审恢复路径，不会真的请求服务。</small></label></div></details>'+endForm('生成提案预览');}
function planFacts(p){const m=model(p.modelId);return '<section class="section"><h2>本次任务目标</h2><p>'+esc(p.goal)+'</p></section><dl class="facts"><div><dt>任务模板</dt><dd>'+esc(p.templateName)+' @'+p.version+'</dd></div><div><dt>模型</dt><dd>'+esc(m?.name||'未选择')+'</dd></div><div><dt>执行位置</dt><dd>'+ (p.location==='local'?'当前平台（本地）':'已连接的远端平台 · 示例')+'</dd></div><div><dt>工具调用上限</dt><dd>'+p.toolCalls+' 次</dd></div><div><dt>输出上限</dt><dd>64 KiB</dd></div><div><dt>所用材料</dt><dd>资料整理提示词 @1</dd></div></dl><details><summary>资料全文与固定范围</summary><div><p><strong>资料</strong><br>'+esc(p.sourceText)+'</p><p class="small muted">仅调用所选模型，处理输入的示例文本；连接权限不随模板共享。</p><code>原创建请求：'+esc(p.requestId)+'</code></div></details>';}
function proposalView(id){const p=proposal(id);if(!p)return missing();let content='';if(p.state==='unknown'){content=note('<strong>原请求结果待核对</strong><p>尚不能确认提案是否生成。保留原请求，先核对；不要再创建一份。</p>','warning')+planFacts(p)+'<div class="actions">'+btn('proposal-check','核对原创建请求','primary','data-id="'+id+'"')+link('/tasks?view=drafts','稍后继续','button')+'</div>';}else if(p.state==='pending'){content=note('提案预览已生成，尚未接受，也没有启动任务。')+planFacts(p)+'<div class="actions">'+btn('proposal-accept','接受并保存固定方案','primary','data-id="'+id+'"')+link('/tasks?view=drafts','稍后继续','button')+'</div><p class="rule">请核对版本、所用连接、预算与执行位置。接受之后才会得到已确认的执行方案。</p>';}else{content=note(p.taskId?'这份方案已创建示例任务，原任务记录保留。':'固定方案已就绪 · 示例。任务尚未启动；请明确选择下一步。')+planFacts(p)+'<div class="actions">'+(p.taskId?link('/task/'+p.taskId,'查看已创建任务','button primary'):btn('proposal-start','开始任务','primary','data-id="'+id+'"'))+(p.location==='local'?link('/schedule-new/'+id,'创建定时计划','button'):'<button disabled>创建定时计划</button>')+'</div>'+(p.location==='remote'?'<p class="rule">定时计划只支持当前平台本地执行的已确认方案；此方案选择了远端平台。</p>':'<p class="rule">创建定时计划会先保存为暂停状态；启用是另一个明确动作。</p>');}return head(p.taskId?'已创建任务的执行方案':p.state==='ready'?'方案已就绪，选择开始方式':'核对这次任务',p.templateName+' · 已保留你的目标与输入',{url:'/tasks?view=drafts',text:'返回创建记录'})+content;}
function authorEdit(id){const t=template(id),d=S.drafts.find(d=>d.id===query().get('draft')&&d.sourceId===id);if(!t)return missing();if(d?.published)return draftView(d.id);const v=formData(route,{name:d?.name||(t.author==='self'?t.name:t.name+'（我的副本）'),description:d?.description||t.description,toolCalls:String(d?.toolCalls||t.toolCalls||3)});return head(d?'继续编辑版本草稿':t.author==='self'?'编辑下一版本':'复制为我的草稿','仅演示当前 v1 支持子集；不会改动已发布的版本。',{url:d?'/draft/'+d.id:'/template/'+id,text:d?'返回草稿':'返回模板'})+(t.author!=='self'?note('原作者版本保持不变。副本保存后属于你，发布是后续独立动作。'):'')+formStart('author-form')+input('name','模板名称',v.name,'名称用于模板列表。','text',true)+textarea('description','用途说明',v.description,'说明给使用者处理什么内容。',true)+'<div class="scopebox"><strong>已有接口与依赖</strong><p>输入：任务目标、资料文本；连接：文本模型；依赖：资料整理提示词 @1。</p><span class="small muted">这些接口在本次引导编辑中保持固定。其他字段需高级定义，本轮不演示。</span></div><details><summary>执行预算</summary><div>'+input('toolCalls','最多工具调用次数',v.toolCalls,'示例中允许 1–20 次。','number',true)+'</div></details>'+endForm('保存版本草稿');}
function draftView(id){const d=S.drafts.find(d=>d.id===id);if(!d)return missing();return head(d.published?'模板版本已发布':'版本草稿已保存',d.name,{url:'/templates',text:'返回模板列表'})+note(d.published?'已发布示例版本可用于创建任务。没有安装新工作台，也没有执行任务。':'草稿尚不能运行。核对后明确发布，其他成员才可使用这个版本。')+'<dl class="facts"><div><dt>版本</dt><dd>@'+d.version+'</dd></div><div><dt>来源</dt><dd>'+esc(d.sourceName)+' @'+d.sourceVersion+'</dd></div><div><dt>作者</dt><dd>本人 · 样例归属</dd></div><div><dt>工具调用上限</dt><dd>'+d.toolCalls+' 次</dd></div></dl><p>'+esc(d.description)+'</p><div class="actions">'+(d.published?link('/template/'+d.publishedId,'使用已发布版本','button primary'):btn('draft-publish','发布这个版本','primary','data-id="'+id+'"')+link('/author/'+d.sourceId+'?draft='+d.id,'继续编辑草稿','button'))+'</div><p class="rule">没有“草稿试运行”。此原型只演示保存与发布的分界，不提交真实定义。</p>';}
function tasks(){const view=query().get('view')||'tasks';let body='';if(view==='schedules'){body=S.schedules.length?'<div class="list">'+S.schedules.map(s=>'<div class="listrow"><div><h3>'+esc(s.name)+' '+badge(s.enabled?'已启用 · 示例':'已暂停',s.enabled?'good':'')+'</h3><p>'+esc(s.time)+' · '+esc(s.timezone)+' · '+(s.cadence==='daily'?'每天':'每周一')+'</p></div>'+link('/schedule/'+s.id,'查看计划','button')+'</div>').join('')+'</div>':'<div class="empty"><h2>还没有定时计划</h2><p>先从已发布任务模板得到当前平台本地执行的已确认方案，再创建计划。</p>'+link('/templates','选择任务模板','button primary')+'</div>';}else if(view==='drafts'){body=S.proposals.length?'<div class="list">'+S.proposals.map(p=>'<div class="listrow"><div><h3>'+esc(p.templateName)+' '+badge({unknown:'原请求待核对',pending:'待接受提案',ready:p.taskId?'方案已启动':'方案已就绪'}[p.state],p.state==='unknown'?'warn':'blue')+'</h3><p>'+esc(p.goal)+'</p></div>'+(p.taskId?'<div class="actions">'+link('/task/'+p.taskId,'查看原任务','button')+link('/proposal/'+p.id,'方案详情','inline-link')+'</div>':link('/proposal/'+p.id,p.state==='unknown'?'核对原请求':p.state==='ready'?'查看已就绪方案':'继续这次创建','button'))+'</div>').join('')+'</div>':'<div class="empty"><h2>还没有创建记录</h2><p>生成提案后，可以在这里继续核对原请求、接受方案或开始任务。</p>'+link('/templates','浏览任务模板','button primary')+'</div>';}else{body='<div class="list">'+[...S.tasks].sort((a,b)=>priority(a)-priority(b)).map(t=>'<div class="listrow"><div class="task-row-main">'+link('/task/'+t.id,esc(t.name))+'<span class="small muted">'+esc(taskDescription(t))+'</span></div>'+badge(statusLabel(t),['waiting','stop-unknown','stop-undispatched','stop-accepted','failed'].includes(t.status)?'warn':t.status==='completed'||t.status==='stopped'?'good':'blue')+'</div>').join('')+'</div><p class="rule">所有任务均为状态样例；没有真实执行或实验产物。</p>';}return head('我的任务','先处理需要你回答、核对或修复的事。')+'<nav class="tabs" aria-label="任务分类">'+link('/tasks','任务',view==='tasks'?'active':'')+link('/tasks?view=schedules','定时计划',view==='schedules'?'active':'')+link('/tasks?view=drafts','创建记录',view==='drafts'?'active':'')+'</nav>'+body;}
function priority(t){return {waiting:0,'stop-unknown':1,'stop-undispatched':1,'stop-accepted':1,failed:2,running:3,stopped:4,completed:5}[t.status]||0;}
function statusLabel(t){return {waiting:'需要回答',failed:'执行失败',running:'运行中 · 示例','stop-unknown':'停止尚未确认','stop-undispatched':'原请求未派发','stop-accepted':'取消已接受，待停止',stopped:'停止已确认 · 示例',completed:'执行完成 · 示例'}[t.status];}
function taskDescription(t){return {waiting:'补充一个回答后继续当前任务。',failed:t.resourceFixed?'已选择后续模型；旧任务仍保持失败。':'模型连接不可用；保留本次记录。',running:'查看当前记录，或明确请求停止。','stop-unknown':'保留原停止请求，先核对回执。','stop-undispatched':'可继续同一个未派发请求。','stop-accepted':'请求已接受，仍需确认执行停止。',stopped:'停止结果已确认；原记录仍保留。',completed:'执行状态与结果有效性分别查看。'}[t.status];}
function taskView(id){const t=task(id);if(!t)return missing();let attention='';if(t.status==='waiting'){const v=formData(route,{answer:t.answer||''});attention='<h2>需要你的回答</h2><p>'+esc(t.question)+'</p>'+formStart('answer-form')+textarea('answer','你的回答',v.answer,'只填写非敏感的示例内容。',true)+endForm('提交回答');}else if(t.status==='failed'){attention='<h2>本次任务已失败</h2><p>已知原因：所选模型的访问凭据已失效。没有得到可验证结果。</p>'+(t.resourceFixed?note('已选择后续使用的模型：'+esc(model(t.repairModelId)?.name||'示例连接')+'。未验证连通性；原失败记录不变。'):'<div class="actions">'+link('/model?origin=task:'+id,'补齐模型配置','button primary')+'</div>')+'<div class="actions">'+link(t.origin==='research'?'/research?from='+id:'/template/'+t.templateId,t.origin==='research'?'返回原项目，核对后续':'回原模板，另建任务','button'+(t.resourceFixed?' primary':''))+'</div><p class="rule">保留失败记录。研究后续需核对原轮次和约定；本轮不演示研究续接，也不会原地重跑。</p>';}else if(t.status.startsWith('stop-')){const isUnknown=t.status==='stop-unknown',undispatched=t.status==='stop-undispatched';attention='<h2>'+esc(isUnknown?'尚不能确认任务已停止':undispatched?'原停止请求尚未派发':'取消已接受，停止仍待确认')+'</h2><p>'+esc(isUnknown?'原请求结果未知。先读取原回执，不会自动重发取消，也不会创建新请求。':undispatched?'本地样例回执明确表示尚未派发；可以继续同一个原请求。':'接受取消与实际停止不同。读取原任务状态后才能确认。')+'</p><div class="actions">'+btn(undispatched?'stop-continue':'stop-check',undispatched?'继续同一个原请求':isUnknown?'核对原停止请求':'核对停止结果','primary','data-id="'+id+'"')+'</div>'+(isUnknown&&t.request.queries?'<p class="rule">刚才查询仍未确认；保留原请求，稍后继续核对。</p>':'')+'<details><summary>原请求与当前回执</summary><div><code>'+esc(t.request.id)+'</code><p>'+esc(undispatched?'状态：明确未派发':isUnknown?'状态：UNKNOWN':'状态：取消决定已接受，未取得停止证据')+'</p></div></details>';}else if(t.status==='stopped'){attention='<h2>停止已确认</h2><p>本地示例记录现在给出了停止确认。原任务与原请求仍然保留。</p><div class="actions">'+link(t.origin==='research'?'/research':'/template/'+t.templateId,'返回原来源','button primary')+'</div>';}else if(t.status==='completed'){attention='<h2>执行已完成，结果仍需核对</h2><p>执行完成不等于证据有效。这个原型没有生成实验产物或可下载结果。</p><details open><summary>查看示例结果说明</summary><div><p>示例结果会包含输入范围、关键结论与证据来源。这里仅演示结果说明的位置，不展示虚构实验指标。</p><p class="muted">证据有效性：未验证。真实下载：本轮不演示。</p></div></details>';}else{attention='<h2>任务正在运行</h2><p>这是本地运行中样例，不会自动完成。你可以返回原来源，或明确请求停止。</p><div class="actions">'+btn('task-stop','请求停止','danger','data-id="'+id+'"')+'</div><p class="rule">请求停止后仍需核对回执和实际停止结果；与暂停定时计划不同。</p>';}
return head(t.name,'原任务上下文 · '+statusLabel(t),{url:'/tasks',text:'返回任务列表'})+'<div class="returnline">'+link(t.origin==='research'?'/research':'/template/'+(t.templateId||'brief'),t.origin==='research'?'← AutoResearch / 低成本文本分类':'← 任务模板 / '+(template(t.templateId||'brief')?.name||'资料摘要'))+'</div><div class="tasklayout"><div><section class="attention">'+attention+'</section><details><summary>执行记录与证据</summary><div><p>任务标识：<code>'+esc(t.id)+'</code></p><p>数据来源：本地交互设计样例。实际模型、主机、执行引擎和产物均未验证。</p>'+ (t.request?'<p>原操作标识：<code>'+esc(t.request.id)+'</code></p>':'')+'</div></details></div><aside class="taskaside"><h3>本次范围</h3><p>固定任务来源<br>'+esc(t.origin==='research'?'低成本文本分类':template(t.templateId||'brief')?.name||'资料摘要')+'</p><p>模型与凭据属于连接所有者。停止、状态读取与重新创建各自保留明确结果。</p>'+link('/settings/storage','存储不足时查看我的空间 →','inline-link')+'</aside></div>';}
function scheduleNew(id){const p=proposal(id);if(!p||p.state!=='ready'||p.location!=='local')return head('不能创建定时计划','需要当前平台本地执行的已确认方案。',{url:'/tasks?view=schedules',text:'返回定时计划'});const v=formData(route,{name:p.templateName+' · 每日',cadence:'daily',time:'09:00',timezone:'Asia/Shanghai'});return head('创建定时计划','先保存为暂停，再由你明确启用。',{url:'/proposal/'+id,text:'返回固定方案'})+'<div class="context">固定来源：'+esc(p.templateName)+' @'+p.version+' · 当前平台（本地） · 最多 '+p.toolCalls+' 次工具调用</div>'+formStart('schedule-form')+input('name','计划名称',v.name,'','text',true)+select('cadence','重复方式',v.cadence,[['daily','每天'],['weekly','每周一']])+input('time','触发时间',v.time,'使用下方所选时区。','time',true)+select('timezone','时区',v.timezone,[['Asia/Shanghai','Asia/Shanghai（北京时间）'],['Etc/UTC','Etc/UTC']])+'<p class="rule">暂停只阻止未来触发，不会停止已经在运行的任务。没有任何真实定时调度。</p>'+endForm('保存暂停的计划');}
function scheduleView(id){const s=schedule(id);if(!s)return missing();const p=proposal(s.proposalId);return head(s.name,'定时计划 · '+(s.enabled?'已启用样例':'已暂停'),{url:'/tasks?view=schedules',text:'返回定时计划'})+note(s.enabled?'示例计划已启用。原型不会自动触发任务。':'计划已保存为暂停；只有明确启用后，才表示允许未来触发。',s.enabled?'':'warning')+'<dl class="facts"><div><dt>重复方式</dt><dd>'+ (s.cadence==='daily'?'每天':'每周一')+'</dd></div><div><dt>时间与时区</dt><dd>'+esc(s.time)+' · '+esc(s.timezone)+'</dd></div><div><dt>固定方案</dt><dd>'+esc(p?.templateName)+' @'+p?.version+'</dd></div></dl><div class="actions">'+btn('schedule-toggle',s.enabled?'暂停未来触发':'启用计划','primary','data-id="'+id+'"')+link('/proposal/'+s.proposalId,'查看固定方案','button')+'</div><p class="rule">暂停计划不会停止已创建的任务。要停止某次执行，请到对应任务明确请求停止。</p>';}
function materials(){return head('模板与材料','按用途复用内容；材料不携带个人凭据。')+'<nav class="tabs" aria-label="共享内容">'+link('/templates','任务模板')+link('/materials','材料','active')+'</nav><div class="list"><div class="listrow"><div><h3>资料整理提示词 '+badge('已发布 @1','blue')+'</h3><p>用于摘要模板的内容提示，不调用外部资源。</p></div>'+link('/material-new','复制为我的提示词','button')+'</div></div><section class="section"><h2>分享一份提示词</h2><p class="muted">先写清内容和用途；来源与许可放在一起，工具接口不会强加到提示词。</p>'+link('/material-new','新建提示词草稿','button primary')+'<p class="rule">工具、模型与环境材料仍有对应登记和接口前置，本轮不演示这些编辑能力。</p></section>';}
function materialNew(){const v=formData(route,{name:'',purpose:'',content:'',license:'MIT',origin:'作者原创',copyright:'原创示例，仅用于交互评审。'});return head('新建提示词草稿','这里只编写提示词；不要求填写工具能力或执行接口。',{url:'/materials',text:'返回材料'})+formStart('material-form')+input('name','名称',v.name,'','text',true)+input('purpose','用途',v.purpose,'让使用者知道适合什么任务。','text',true)+textarea('content','提示词内容',v.content,'仅填写示例内容，不放入秘密或公司材料。',true)+'<details><summary>来源与许可</summary><div>'+select('license','许可证',v.license,[['MIT','MIT'],['Apache-2.0','Apache-2.0'],['CC0-1.0','CC0-1.0'],['CC-BY-4.0','CC-BY-4.0']])+input('origin','来源',v.origin)+textarea('copyright','来源及版权说明',v.copyright)+'</div></details>'+endForm('保存提示词草稿');}
function settings(){return head('设置','低频维护与范围说明，不影响日常开始工作。')+'<div class="list">'+[['storage','我的存储与回收','只处理本人任务目录；隔离、恢复和永久删除边界保留。'],['connections','高级连接与运行信息','工具、远程服务、租约与可信登记。'],['archive','旧审批记录','历史只读档案，不包含活跃提案或待核对操作。'],['accounts','账号与接入','保留既有管理员能力，不新增用户管理产品。']].map(([k,t,d])=>'<div class="listrow"><div><h3>'+t+'</h3><p>'+d+'</p></div>'+link('/settings/'+k,'查看范围','button')+'</div>').join('')+'</div>';}
function settingDetail(k){const defs={storage:['我的存储与回收','本轮只演示入口，不模拟文件删除。',['只展示本人的目录与回收计划，不能扩大到团队数据。','预览、隔离、恢复、永久回收需要各自真实结果；此原型不提供假按钮。','空间不足时，应从受影响任务带着来源进入这里。']],connections:['高级连接与运行信息','这些能力按用途保留，暂不做完整维护演示。',['MCP/CLI 工具、已有远程服务、凭据轮换仍有各自配置边界。','连接登记、验证、允许执行和业务就绪不是同一个状态。','执行租约与 UNKNOWN 核对在相关任务或资源的技术详情中查看。']],archive:['旧审批记录（只读）','用于查看历史，不恢复审批或旧执行。',['本轮没有历史记录样例，也不提供审批、重跑或重发布动作。','活跃提案和原请求恢复仍在“我的任务 → 创建记录”或原任务。']],accounts:['账号与接入','本原型没有登录、身份切换或账号管理模拟。',['现有账号管理员能力只属于已授权管理员，不因进入设置而扩大权限。','当前极简登录将来由已有内网应用替代。','本轮不演示创建账号、改密码、邀请或角色管理。']],servers:['我的 Linux 主机','本轮仅使用已准备的研究环境样例。',['真实接入需要地址、SSH 账户、端口、主机公钥、私有工作目录及认证。','主机身份核对、连接检查与应用准备必须分别确认。','本原型不请求真实 SSH 密钥，也不连接远程主机。']], 'template-advanced':['高级模板的前置条件','v2 / native 不在本次引导编辑支持范围。',['准备符合当前契约的高级定义与已登记组件。','选择已发布材料版本，声明输入 schema、能力、依赖和预算。','保存草稿后仍需明确发布，再使用已发布定义创建任务；没有草稿试运行。']]};const d=defs[k];if(!d)return missing();return head(d[0],d[1],{url:k==='template-advanced'?'/templates':'/settings',text:k==='template-advanced'?'返回任务模板':'返回设置'})+note('本轮不演示此维护能力。以下为必须保留的范围，没有真实操作。','warning')+'<div class="stack">'+d[2].map(x=>'<p>'+esc(x)+'</p>').join('')+'</div>';}
function missing(){return head('这个示例页面不存在','可以回到应用继续，已保存的样例状态仍保留。')+link('/apps','返回应用','button primary');}
function render(){$('#live').textContent=S.notice||'';activeFormKey=null;const p=path(),parts=p.split('/');let html;if(p==='/apps')html=apps();else if(p==='/research')html=project();else if(p==='/resources')html=resources();else if(p==='/model')html=models();else if(p==='/model-new')html=modelNew();else if(p==='/templates')html=templates();else if(parts[1]==='template')html=templateDetail(parts[2]);else if(parts[1]==='run')html=runTemplate(parts[2]);else if(parts[1]==='proposal')html=proposalView(parts[2]);else if(parts[1]==='author')html=authorEdit(parts[2]);else if(parts[1]==='draft')html=draftView(parts[2]);else if(p==='/tasks')html=tasks();else if(parts[1]==='task')html=taskView(parts[2]);else if(parts[1]==='schedule-new')html=scheduleNew(parts[2]);else if(parts[1]==='schedule')html=scheduleView(parts[2]);else if(p==='/materials')html=materials();else if(p==='/material-new')html=materialNew();else if(p==='/settings')html=settings();else if(parts[1]==='settings')html=settingDetail(parts[2]);else html=missing();$('#main').innerHTML=(!storageOK?note('浏览器限制了本地存储；本次可以继续演示，但刷新后无法保留样例。','warning'):'')+(S.notice?note(esc(S.notice)):'')+html;S.notice='';renderNav();persist();document.title=($('#main h1')?.textContent||'Agent Factory')+' · 设计原型';window.scrollTo(0,0);$('#main h1')?.focus({preventScroll:true});updateActionButtons();}
function rerender(){const y=scrollY;render();window.scrollTo(0,y);}
function selectModel(id,origin){if(origin==='research'){if(S.project.taskId)S.project.candidateModel=id;else{S.project.model=id;S.project.stage='resources';}}else if(origin.startsWith('task:')){const t=task(origin.slice(5));if(t){t.resourceFixed=true;t.repairModelId=id;}}else if(origin.startsWith('run:')){const key=S.contextRoutes?.[origin]||'/run/'+origin.slice(4);if(S.forms[key]){S.forms[key].values.modelId=id;S.forms[key].dirty=false;}}persist();}
function errorsShow(errors){formErrors=errors;render();const first=Object.keys(errors)[0];const target=$('#'+first);let parent=target?.parentElement;while(parent){if(parent.tagName==='DETAILS')parent.open=true;parent=parent.parentElement;}target?.focus();$('#'+first)?.scrollIntoView({block:'center'});}
document.addEventListener('input',e=>{const f=e.target.closest('form');if(!f)return;const key=activeFormKey||route;if(!S.forms[key])S.forms[key]={values:{},dirty:false};const data=Object.fromEntries(new FormData(f));f.querySelectorAll('input[type=checkbox]').forEach(el=>data[el.name]=el.checked);S.forms[key]={values:data,dirty:true};activeFormKey=key;persist();});
document.addEventListener('change',e=>{if(['service','auth'].includes(e.target.name)&&path()==='/model-new'){const y=scrollY;render();window.scrollTo(0,y);$('#'+e.target.name)?.focus();}});
document.addEventListener('submit',e=>{e.preventDefault();if(!beginAction())return;const form=e.target,kind=form.dataset.form,v=Object.fromEntries(new FormData(form)),parts=path().split('/');let errors={};
if(kind==='model-form'){if(!v.modelId.trim())errors.modelId='填写一个示例模型 ID。';if(v.service==='compatible'){try{const u=new URL(v.endpoint);if(!['https:','http:'].includes(u.protocol)||!u.hostname.endsWith('.invalid'))throw 0;}catch(x){errors.endpoint='请输入完整的 .invalid 示例 API 地址，例如 https://model.example.invalid/v1。';}}if(Object.keys(errors).length)return errorsShow(errors);const id=newId('model'),origin=query().get('origin')||'resources';S.models.push({id,name:v.modelId.trim()+' · 示例配置',service:v.service,model:v.modelId.trim(),endpoint:v.service==='compatible'?v.endpoint:'https://api.example.invalid/v1',protocol:v.protocol||'Chat Completions',auth:v.auth==='none'?'无需认证':'固定示例凭据',scope:'个人',verified:false});selectModel(id,origin);markSaved();finishModel(origin,'示例配置已保存，未验证连通性；未启动新任务。');}
else if(kind==='match-form'){if(!v.goal.trim())return errorsShow({goal:'先填写一个示例目标。'});const id=/比较|差异|方案/.test(v.goal)?'compare':'brief';markSaved();setNotice('按目标关键词匹配到一个已发布模板；这不是 AI 推断。');navigate('/run/'+id+'?goal='+encodeURIComponent(v.goal.trim()),true);}
else if(kind==='run-form'){if(!v.goal.trim())errors.goal='说明这次要完成的目标。';if(!v.sourceText.trim())errors.sourceText='填写要处理的示例资料。';if(!(Number.isInteger(Number(v.toolCalls))&&Number(v.toolCalls)>=1&&Number(v.toolCalls)<=20))errors.toolCalls='工具调用次数需为 1–20 的整数。';if(Object.keys(errors).length)return errorsShow(errors);const t=template(parts[2]),id=newId('proposal');S.proposals.push({id,requestId:'create-'+id,templateId:t.id,templateName:t.name,version:t.version,goal:v.goal.trim(),sourceText:v.sourceText.trim(),modelId:v.modelId,location:v.location||'local',toolCalls:Number(v.toolCalls||3),state:v.unknown?'unknown':'pending',taskId:null});markSaved();navigate('/proposal/'+id,true);}
else if(kind==='author-form'){if(!v.name.trim())errors.name='填写模板名称。';if(!v.description.trim())errors.description='说明模板的用途。';if(!(Number.isInteger(Number(v.toolCalls))&&Number(v.toolCalls)>=1&&Number(v.toolCalls)<=20))errors.toolCalls='工具调用次数需为 1–20 的整数。';if(Object.keys(errors).length)return errorsShow(errors);const t=template(parts[2]),existing=S.drafts.find(d=>d.id===query().get('draft')&&d.sourceId===t.id);if(existing?.published)return;const id=existing?.id||newId('draft');if(existing)Object.assign(existing,{name:v.name.trim(),description:v.description.trim(),toolCalls:Number(v.toolCalls)});else S.drafts.push({id,name:v.name.trim(),description:v.description.trim(),version:t.author==='self'?t.version+1:1,sourceName:t.name,sourceVersion:t.version,sourceId:t.id,copy:t.author!=='self',toolCalls:Number(v.toolCalls||3),published:false});markSaved();navigate('/draft/'+id,true);}
else if(kind==='answer-form'){if(!v.answer.trim())return errorsShow({answer:'先填写对这个问题的回答。'});const t=task(parts[2]);t.answer=v.answer.trim();t.status='running';markSaved();setNotice('示例回答已提交；当前任务继续显示运行中，不代表任务完成。');render();}
else if(kind==='schedule-form'){if(!v.name.trim())errors.name='填写计划名称。';if(!v.time)errors.time='选择触发时间。';if(Object.keys(errors).length)return errorsShow(errors);const p=proposal(parts[2]);if(p.state!=='ready'||p.location!=='local')return;const id=newId('schedule');S.schedules.push({id,name:v.name.trim(),cadence:v.cadence,time:v.time,timezone:v.timezone,proposalId:p.id,enabled:false});markSaved();navigate('/schedule/'+id,true);}
else if(kind==='material-form'){if(!v.name.trim())errors.name='填写提示词名称。';if(!v.purpose.trim())errors.purpose='说明提示词适合什么任务。';if(!v.content.trim())errors.content='填写示例提示词内容。';if(Object.keys(errors).length)return errorsShow(errors);S.materialDraft={...v,saved:true};markSaved();setNotice('提示词示例草稿已保存，尚未发布。当前原型不演示材料发布。');navigate('/materials',true);}persist();
});
document.addEventListener('click',e=>{if(e.target.closest('.skip')){e.preventDefault();$('#main h1')?.focus();$('#main').scrollIntoView();return;}const nav=e.target.closest('[data-nav]');if(nav){e.preventDefault();if(nav.dataset.nav.startsWith('/model?origin=run:')){const origin=new URLSearchParams(nav.dataset.nav.split('?')[1]).get('origin');S.contextRoutes=S.contextRoutes||{};S.contextRoutes[origin]=route;if(activeFormKey&&S.forms[activeFormKey])S.forms[activeFormKey].dirty=false;persist();navigate(nav.dataset.nav,true);}else navigate(nav.dataset.nav);return;}const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,id=b.dataset.id;if(protectedActions.has(a)&&!beginAction())return;
if(a==='more'){moreOpen=!moreOpen;renderNav();return;}if(a==='reset'){$('#reset-dialog').showModal();return;}if(a==='reset-cancel'){$('#reset-dialog').close();return;}if(a==='reset-confirm'){$('#reset-dialog').close();S=seed();activeFormKey=null;formErrors={};persist();navigate('/apps',true);render();return;}if(a==='stay'){$('#leave-dialog').close();leaveTarget=null;return;}if(a==='discard'){if(activeFormKey)delete S.forms[activeFormKey];activeFormKey=null;formErrors={};persist();$('#leave-dialog').close();const t=leaveTarget;leaveTarget=null;if(t?.popDelta){history.go(t.popDelta);}else if(t)navigate(t.url,true);return;}
if(a==='choose-model'){selectModel(id,b.dataset.origin);finishModel(b.dataset.origin,'已选择示例连接，未验证连通性；未启动新任务。');}
if(a.startsWith('project-')){const p=S.project,stage=p.stage;if(p.taskId)return;if(a==='project-save'&&p.model){p.stage='draft';setNotice('研究配置示例草稿已保存，尚未发布。');}if(a==='project-publish'&&stage==='draft'){p.stage='published';setNotice('配置定义已发布为示例版本；团队可读定义，个人连接与凭据不公开。');}if(a==='project-apply'&&stage==='published'){p.stage='applied';setNotice('已将发布的示例配置用于当前约定并保存；约定仍未确认。');}if(a==='project-confirm'&&stage==='applied'){p.stage='confirmed';setNotice('研究约定已确认；还没有启动任务。');}if(a==='project-start'&&stage==='confirmed'&&!p.taskId){const taskId=newId('research-task');S.tasks.unshift({id:taskId,name:p.name,status:'running',origin:'research'});p.taskId=taskId;p.stage='started';persist();navigate('/task/'+taskId,true);return;}persist();render();}
if(a==='templates-empty'){S.emptyTemplates=!S.emptyTemplates;S.templateLoadError=false;persist();render();}if(a==='templates-error'){S.templateLoadError=true;persist();render();}if(a==='templates-retry'){S.templateLoadError=false;persist();setNotice('已重新读取本地示例模板。');render();}
if(a==='proposal-check'){const p=proposal(id);if(p.state==='unknown'){p.state='pending';setNotice('已核对同一个原创建请求；示例提案已找到，尚未接受。');persist();render();}}
if(a==='proposal-accept'){const p=proposal(id);if(p.state==='pending'){p.state='ready';persist();render();$('#live').textContent='方案已就绪。';}}
if(a==='proposal-start'){const p=proposal(id);if(p.state==='ready'&&!p.taskId){const taskId=newId('template-task');S.tasks.unshift({id:taskId,name:p.goal,status:'running',origin:'template',templateId:p.templateId});p.taskId=taskId;persist();navigate('/task/'+taskId,true);}}
if(a==='draft-publish'){const d=S.drafts.find(x=>x.id===id);if(d&&!d.published){let target;if(d.copy){target={id:newId('template'),name:d.name,description:d.description,version:d.version,author:'self',contract:'v1',published:true,toolCalls:d.toolCalls};S.templates.push(target);}else{target=template(d.sourceId);target={...target,id:newId('template-version'),name:d.name,description:d.description,version:d.version,toolCalls:d.toolCalls};S.templates.push(target);}d.published=true;d.publishedId=target.id;persist();render();}}
if(a==='task-stop'){const t=task(id);if(t?.status==='running'){t.status='stop-unknown';t.request={id:newId('stop-request'),queries:0};persist();render();}}
if(a==='stop-check'){const t=task(id);if(t.status==='stop-unknown'){t.request.queries++;if(t.request.queries>=2)t.status='stop-undispatched';}else if(t.status==='stop-accepted')t.status='stopped';persist();render();}
if(a==='stop-continue'){const t=task(id);if(t.status==='stop-undispatched'){t.status='stop-accepted';setNotice('同一个原停止请求已被示例回执接受，停止尚未确认。');persist();render();}}
if(a==='schedule-toggle'){const s=schedule(id);s.enabled=!s.enabled;persist();setNotice(s.enabled?'示例计划已启用；不会真实触发。':'已暂停未来触发；已有运行任务不会因此停止。');render();}
});
$('#leave-dialog').addEventListener('cancel',()=>{leaveTarget=null;});
render();
</script>
</body>
</html>
