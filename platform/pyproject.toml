[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "department-agent-factory-core"
version = "0.2.0"
description = "Application-independent Agno AgentOS factory capabilities"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "agno==3.1.0",
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "sqlalchemy[asyncio]==2.1.1",
  "psycopg[binary]==3.3.6",
  "httpx==0.28.1",
  "pyjwt[crypto]==2.15.1",
  "cryptography==50.0.2",
  "python-multipart==0.0.32",
  "croniter==6.2.4",
  "pytz==2026.4",
]

[tool.hatch.build.targets.wheel]
packages = ["agent_factory"]

[tool.hatch.build.targets.sdist]
include = ["agent_factory", "pyproject.toml", "LICENSE"]
