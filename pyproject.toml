[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "department-agent-factory"
version = "0.2.0"
description = "Scoped departmental factory over the native Agno AgentOS runtime"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "agno==3.1.0",
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "sqlalchemy[asyncio]==2.1.1",
  "psycopg[binary]==3.3.6",
  "httpx==0.28.1",
  "mcp==2.3.0",
  "pyjwt[crypto]==2.15.1",
  "cryptography==50.0.2",
  "argon2-cffi==25.1.0",
  "bcrypt==5.0.0; sys_platform == 'win32'",
  "pywin32==312; sys_platform == 'win32'",
  "python-multipart==0.0.32",
  "croniter==6.2.4",
  "pytz==2026.4",
]

[project.scripts]
agent-factory-local-user = "agent_factory.local_login:main"
agent-factory-ssh-askpass = "agent_factory.windows_ssh_askpass:main"
agent-factory = "agent_factory_server.main:main"
agent-factory-research = "agent_factory_server.research:main"

[tool.hatch.build.targets.wheel]
packages = ["platform/agent_factory", "deployment/agent_factory_server", "applications/research"]

[dependency-groups]
ssh-probe = ["bcrypt==5.0.0"]
browser = [
    "playwright==1.58.0",
]
dev = ["ruff==0.15.8", "pyright==1.1.408", "hatchling==1.29.0"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E701", "E702"]

[tool.pyright]
extraPaths = ["applications"]
include = ["platform/agent_factory", "deployment/agent_factory_server", "applications/research"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
