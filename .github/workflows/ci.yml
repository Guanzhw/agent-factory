name: Project checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scope:
    name: Select CI mode
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      os: ${{ steps.select.outputs.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Check mode selection and summary behavior
        run: python -m unittest discover -s tests/ci -p test_ci_scope.py -v
      - name: Select docs, daily fast, or manually requested full checks
        id: select
        run: python scripts/ci_scope.py
  frontend:
    needs: scope
    if: needs.scope.outputs.mode != 'docs'
    strategy:
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.os) }}
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-24.04' || matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit production dependencies against the official registry
        if: runner.os == 'Linux'
        run: npm audit --omit=dev --audit-level=moderate --registry=https://registry.npmjs.org
      - name: Audit all dependencies against the official registry
        if: runner.os == 'Linux'
        run: npm audit --audit-level=moderate --registry=https://registry.npmjs.org
      - run: node --test scripts/check_web_architecture.test.mjs
      - run: node scripts/check_web_architecture.mjs --config scripts/architecture-web.json
      - run: npm run check
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        if: runner.os == 'Linux'
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        if: runner.os == 'Linux'
        with:
          version: '0.12.1'
      - name: Install locked browser tooling
        if: runner.os == 'Linux'
        run: uv sync --frozen --only-group browser
      - name: Install matching Chromium and system dependencies
        if: runner.os == 'Linux'
        run: uv run --no-sync python -m playwright install --with-deps chromium
      - name: Real Chromium personal-tool configured and lost-binding-ack smoke
        if: runner.os == 'Linux'
        run: uv run --no-sync python platform/tests/browser/personal_tools_smoke.py --desktop-only --scenario configured --scenario bind-loss --output "${{ runner.temp }}/personal-tool-browser"
      - run: npm run build:research
  python:
    needs: scope
    if: needs.scope.outputs.mode != 'docs'
    strategy:
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.1'
      - run: uv sync --frozen
      - run: uv run ruff check platform deployment applications scripts
      - run: uv run pyright
      - run: uv run python scripts/check_architecture.py --config scripts/architecture-python.json
      - name: Fast selected Python regressions
        if: needs.scope.outputs.mode == 'fast'
        run: uv run python scripts/check_fast.py --suite python
      - name: Full Python compatibility discovery
        if: needs.scope.outputs.mode == 'full' && runner.os == 'Windows'
        run: uv run python scripts/check_python.py
      - name: Native Windows PostgreSQL original-operation recovery
        if: needs.scope.outputs.mode == 'full' && runner.os == 'Windows'
        shell: python
        run: |
          import os
          from pathlib import Path
          import socket
          import subprocess
          import tempfile

          pg_bin = Path(os.environ['PGBIN'])
          subprocess.run([str(pg_bin / 'postgres.exe'), '--version'], check=True)
          with tempfile.TemporaryDirectory(prefix='research-windows-pg-', dir=os.environ['RUNNER_TEMP']) as directory:
              root = Path(directory)
              data = root / 'data'
              password = root / 'password.txt'
              password.write_text('ci-fixture-only\n', encoding='utf-8')
              subprocess.run([str(pg_bin / 'initdb.exe'), '-D', str(data), '-U', 'factory_ci',
                              '--auth=scram-sha-256', '--encoding=UTF8', '--pwfile=' + str(password)], check=True)
              with socket.socket() as listener:
                  listener.bind(('127.0.0.1', 0))
                  port = listener.getsockname()[1]
              pg_ctl = [str(pg_bin / 'pg_ctl.exe'), '-D', str(data), '-w']
              try:
                  subprocess.run([*pg_ctl, '-l', str(root / 'postgres.log'),
                                  '-o', f'-h 127.0.0.1 -p {port}', 'start'], check=True)
                  env = dict(os.environ)
                  env['FACTORY_TEST_DATABASE_URL'] = f'postgresql+psycopg://factory_ci:ci-fixture-only@127.0.0.1:{port}/postgres'
                  env['AGNO_TELEMETRY'] = 'false'
                  env['PYTHONPATH'] = os.pathsep.join(['platform', 'deployment', 'applications',
                                                     'platform/tests', 'applications/tests'])
                  code = r'''
          import sys, unittest
          suite = unittest.defaultTestLoader.loadTestsFromName('test_research_windows_restart.ResearchWindowsRestartTests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          for case, traceback in [*result.failures, *result.errors]:
              message = (case.id() + '\n' + traceback).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error::' + message)
          print(f'Windows PostgreSQL recovery: {result.testsRun} tests; {len(result.skipped)} skips')
          sys.exit(0 if result.testsRun == 3 and result.wasSuccessful() and not result.skipped else 1)
          '''
                  subprocess.run([str(Path('.venv/Scripts/python.exe').resolve()), '-c', code], env=env, check=True)
              finally:
                  if (data / 'postmaster.pid').exists():
                      subprocess.run([*pg_ctl, '-m', 'fast', 'stop'], check=True)
  postgres:
    needs: scope
    if: needs.scope.outputs.mode != 'docs'
    runs-on: ubuntu-latest
    services:
      postgres:
        # Docker Official Image, with the same locked version and OCI digest.
        image: docker.io/library/postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_USER: factory_ci
          POSTGRES_PASSWORD: ci-fixture-only
          POSTGRES_DB: factory_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # This credential belongs only to this disposable synthetic CI service.
      FACTORY_TEST_DATABASE_URL: postgresql+psycopg://factory_ci:ci-fixture-only@127.0.0.1:5432/factory_test
      AGNO_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: '0.12.1'
      - run: uv sync --frozen
      - name: Install and start the independent core without application source
        run: uv run python scripts/check_core_install.py
      - name: Fast required PostgreSQL, process custody and small-tree regressions
        if: needs.scope.outputs.mode == 'fast'
        run: uv run python scripts/check_fast.py --suite postgres
      - name: Full PostgreSQL discovery and required acceptance (manual release check)
        if: needs.scope.outputs.mode == 'full'
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/postgres-completion.json"
          set +e
          uv run python scripts/check_postgres.py --summary-file "$RUNNER_TEMP/postgres-completion.json" > "$RUNNER_TEMP/postgres-tests.log" 2>&1 &
          test_pid=$!
          (
            while kill -0 "$test_pid" 2>/dev/null; do
              sleep 60
              if kill -0 "$test_pid" 2>/dev/null; then
                echo "PostgreSQL suite is still running; recent diagnostic output:"
                tail -n 8 "$RUNNER_TEMP/postgres-tests.log"
              fi
            done
          ) &
          progress_pid=$!
          wait "$test_pid"
          test_status=$?
          kill "$progress_pid" 2>/dev/null || true
          wait "$progress_pid" 2>/dev/null || true
          cat "$RUNNER_TEMP/postgres-tests.log"
          exit "$test_status"
      - name: Verify full PostgreSQL completion
        if: always() && needs.scope.outputs.mode == 'full'
        shell: bash
        run: |
          uv run python - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          summary = json.loads((Path(os.environ['RUNNER_TEMP']) / 'postgres-completion.json').read_text())
          rendered = json.dumps(summary, sort_keys=True)
          print(rendered)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('### PostgreSQL completion\n\n```json\n' + rendered + '\n```\n')
          if summary.get('suite') != 'postgres_acceptance' or summary.get('accepted') is not True:
              raise SystemExit('PostgreSQL completion was not accepted')
          PYTHON
      - name: Locate full PostgreSQL evidence log
        if: always() && needs.scope.outputs.mode == 'full'
        id: postgres_log
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/postgres-tests.log" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Preserve full PostgreSQL evidence log
        if: always() && needs.scope.outputs.mode == 'full' && steps.postgres_log.outputs.exists == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: postgres-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/postgres-tests.log
          retention-days: 7
          if-no-files-found: error
  summary:
    name: CI summary
    if: always()
    needs: [scope, frontend, python, postgres]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Report the selected scope without equating fast and full acceptance
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python scripts/ci_scope.py --summary
