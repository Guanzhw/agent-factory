name: Project checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scope:
    name: Select CI mode
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      os: ${{ steps.select.outputs.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Check mode selection and summary behavior
        run: python -m unittest discover -s tests/ci -p test_ci_scope.py -v
      - name: Select docs, daily fast, or manually requested full checks
        id: select
        run: python scripts/ci_scope.py
  frontend:
    needs: scope
    if: needs.scope.outputs.mode != 'docs'
    strategy:
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test scripts/check_web_architecture.test.mjs
      - run: node scripts/check_web_architecture.mjs --config scripts/architecture-web.json
      - run: npm run check
  python:
    needs: scope
    if: needs.scope.outputs.mode != 'docs'
    strategy:
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.1'
      - run: uv sync --frozen
      - run: uv run ruff check platform apps/research deployment scripts
      - run: uv run pyright
      - run: uv run python scripts/check_architecture.py --config scripts/architecture-python.json
      - name: Fast selected Python regressions
        if: needs.scope.outputs.mode == 'fast'
        run: uv run python scripts/check_fast.py --suite python
      - name: Full Python compatibility discovery
        if: needs.scope.outputs.mode == 'full'
        run: uv run python scripts/check_python.py
  postgres:
    needs: scope
    if: needs.scope.outputs.mode != 'docs'
    runs-on: ubuntu-latest
    services:
      postgres:
        # Docker Official Images on ECR Public; identical locked OCI digest.
        # https://gallery.ecr.aws/docker/library/postgres (anonymous pull, no secrets)
        image: public.ecr.aws/docker/library/postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_USER: factory_ci
          POSTGRES_PASSWORD: ci-fixture-only
          POSTGRES_DB: factory_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # This credential belongs only to this disposable synthetic CI service.
      FACTORY_TEST_DATABASE_URL: postgresql+psycopg://factory_ci:ci-fixture-only@127.0.0.1:5432/factory_test
      AGNO_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: '0.12.1'
      - run: uv sync --frozen
      - name: Install and start the independent core without application source
        run: uv run python scripts/check_core_install.py
      - name: Fast required PostgreSQL, process custody and small-tree regressions
        if: needs.scope.outputs.mode == 'fast'
        run: uv run python scripts/check_fast.py --suite postgres
      - name: Full PostgreSQL discovery and required acceptance (manual release check)
        if: needs.scope.outputs.mode == 'full'
        shell: bash
        run: |
          set +e
          uv run python scripts/check_postgres.py > "$RUNNER_TEMP/postgres-tests.log" 2>&1 &
          test_pid=$!
          (
            while kill -0 "$test_pid" 2>/dev/null; do
              sleep 60
              if kill -0 "$test_pid" 2>/dev/null; then
                echo "PostgreSQL suite is still running; recent diagnostic output:"
                tail -n 8 "$RUNNER_TEMP/postgres-tests.log"
              fi
            done
          ) &
          progress_pid=$!
          wait "$test_pid"
          test_status=$?
          kill "$progress_pid" 2>/dev/null || true
          wait "$progress_pid" 2>/dev/null || true
          tail -n 400 "$RUNNER_TEMP/postgres-tests.log"
          exit "$test_status"
  summary:
    name: CI summary
    if: always()
    needs: [scope, frontend, python, postgres]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Report the selected scope without equating fast and full acceptance
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python scripts/ci_scope.py --summary
