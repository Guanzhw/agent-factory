name: Windows SSH credential candidate experiment
on:
  pull_request:
    paths:
      - scripts/probe_windows_ssh_key.py
      - .github/workflows/windows-ssh-key-probe.yml
permissions:
  contents: read
jobs:
  credential-candidate:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: '0.12.1'
      - run: uv sync --frozen
      - name: Test synthetic key readability and kernel cleanup
        timeout-minutes: 1
        shell: pwsh
        run: |
          $report = & uv run python scripts/probe_windows_ssh_key.py
          $probeExitCode = $LASTEXITCODE
          $report | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/windows-ssh-key-probe.json"
          Get-Content "$env:RUNNER_TEMP/windows-ssh-key-probe.json"
          exit $probeExitCode
      - name: Preserve the first candidate result, including rejection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-ssh-key-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/windows-ssh-key-probe.json
          if-no-files-found: error
